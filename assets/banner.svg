<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Animated Accent Flow Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 19px;
      font-weight: 400;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
    }
    .code-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Animated Ambient Glow Spheres (Background) -->
  <g opacity="0.35">
    <circle cx="150" cy="100" r="130" fill="#0284c7">
      <animate attributeName="r" values="120;145;120" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="180" r="160" fill="#7c3aed">
      <animate attributeName="r" values="150;180;150" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="380" r="140" fill="#0d9488">
      <animate attributeName="r" values="130;160;130" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.4;0.2" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Dynamic Decorative Waves & Circuit Lines (Behind Content) -->
  <g stroke-linecap="round" opacity="0.4">
    <!-- Connecting flow wave 1 -->
    <path d="M -50 330 Q 300 240 650 340 T 1250 260" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" stroke-dasharray="12 8">
      <animate attributeName="stroke-dashoffset" values="0;200" dur="10s" repeatCount="indefinite" />
    </path>
    <!-- Connecting flow wave 2 -->
    <path d="M -50 280 Q 250 370 700 250 T 1250 320" fill="none" stroke="url(#flowGrad)" stroke-width="1.5" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" values="200;0" dur="14s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Dynamic Right-side Graphic: Stylized Mobile Device & Builder Canvas -->
  <g transform="translate(860, 48)">
    <!-- Ambient Phone Glow -->
    <rect x="0" y="0" width="240" height="324" rx="36" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#subtleGlow)" />
    
    <!-- Phone Screen Inner -->
    <rect x="8" y="8" width="224" height="308" rx="28" fill="#030712" />
    
    <!-- Dynamic Phone Notch/Speaker -->
    <rect x="85" y="16" width="70" height="5" rx="2.5" fill="#334155" />
    
    <!-- Dynamic Mini App Canvas Elements -->
    <!-- App Header -->
    <rect x="24" y="36" width="192" height="28" rx="8" fill="#1e293b" />
    <circle cx="38" cy="50" r="5" fill="#38bdf8" />
    <rect x="52" y="47" width="70" height="6" rx="3" fill="#64748b" />
    
    <!-- Animated Drag & Drop Visual Block 1 -->
    <g>
      <rect x="24" y="74" width="192" height="54" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="36" y="86" width="30" height="30" rx="8" fill="#0284c7" />
      <path d="M 46 101 L 56 101 M 51 96 L 51 106" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <rect x="76" y="88" width="80" height="7" rx="3.5" fill="#f8fafc" />
      <rect x="76" y="101" width="110" height="5" rx="2.5" fill="#64748b" />
    </g>

    <!-- Animated Drag & Drop Visual Block 2 -->
    <g>
      <rect x="24" y="138" width="192" height="68" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
      </rect>
      <!-- Tiny chart graph inside phone -->
      <path d="M 40 186 L 68 168 L 96 178 L 126 154 L 158 164 L 196 148" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="126" cy="154" r="3.5" fill="#c084fc">
        <animate attributeName="r" values="3.5;5;3.5" dur="2s" repeatCount="indefinite" />
      </circle>
      <rect x="36" y="148" width="55" height="5" rx="2.5" fill="#94a3b8" />
    </g>

    <!-- Animated Drag & Drop Visual Block 3 (Action Button) -->
    <rect x="24" y="216" width="192" height="36" rx="10" fill="url(#flowGrad)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="2.5s" repeatCount="indefinite" />
    </rect>
    <rect x="80" y="231" width="80" height="6" rx="3" fill="#ffffff" />

    <!-- Bottom Navigation Bar -->
    <rect x="24" y="262" width="192" height="32" rx="8" fill="#1e293b" />
    <circle cx="56" cy="278" r="4" fill="#38bdf8" />
    <circle cx="120" cy="278" r="4" fill="#64748b" />
    <circle cx="184" cy="278" r="4" fill="#64748b" />

    <!-- Floating Component Tag (Left of Phone) -->
    <g transform="translate(-50, 95)">
      <rect x="0" y="0" width="94" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" filter="url(#subtleGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="3s" repeatCount="indefinite" />
      </rect>
      <text x="47" y="17" text-anchor="middle" class="code-text" fill="#a5b4fc">&lt;Widget/&gt;</text>
    </g>

    <!-- Floating Component Tag 2 (Right of Phone) -->
    <g transform="translate(190, 190)">
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" filter="url(#subtleGlow)">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="3.5s" repeatCount="indefinite" />
      </rect>
      <text x="43" y="17" text-anchor="middle" class="code-text" fill="#5eead4">Dart/APK</text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content, Title, Subtitle, and Feature Badges (Always in Front) -->
  <g transform="translate(70, 75)">
    <!-- Category Pill Tag -->
    <g>
      <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="32" y="21" class="badge-text" fill="#38bdf8">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title (Large, Clear, High-Contrast Foreground) -->
    <g transform="translate(0, 72)">
      <text x="0" y="0" class="title-text">Awesome Mobile</text>
      <text x="0" y="48" class="title-text" fill="url(#flowGrad)">Development Studio</text>
    </g>

    <!-- Subtitle (Clear, Crisp in Foreground) -->
    <text x="0" y="160" class="subtitle-text">
      The authoritative guide to Visual App Builders, Low-Code Mobile
    </text>
    <text x="0" y="186" class="subtitle-text">
      Platforms, Drag-and-Drop Studios &amp; Sovereign Open-Source Stacks.
    </text>

    <!-- Feature Attribute Pills (Foreground, High Legibility) -->
    <g transform="translate(0, 222)">
      <!-- Pill 1: Visual Canvas -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">⚡ Visual Canvas</text>
      </g>
      <!-- Pill 2: iOS & Android -->
      <g transform="translate(160, 0)">
        <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📱 iOS &amp; Android</text>
      </g>
      <!-- Pill 3: Low-Code / No-Code -->
      <g transform="translate(315, 0)">
        <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">🚀 Low-Code Studio</text>
      </g>
      <!-- Pill 4: Code Export -->
      <g transform="translate(485, 0)">
        <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="14" y="22" class="badge-text">📦 Dart &amp; React Native</text>
      </g>
    </g>
  </g>

  <!-- Banner Outer Border with subtle animated gradient highlight -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="url(#flowGrad)" stroke-width="1.5" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" />
  </rect>
</svg>
